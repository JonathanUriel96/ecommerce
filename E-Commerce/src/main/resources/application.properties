spring.application.name=ecommerce

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ecommerce_db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

app.auth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.auth.google.frontend-url=${FRONTEND_URL:http://localhost:5174}
app.auth.google.authorization-url=${GOOGLE_AUTHORIZATION_URL:http://localhost:8080/oauth2/authorization/google}
